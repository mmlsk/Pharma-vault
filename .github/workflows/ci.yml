name: CI
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: make catalog pk chembl identity verify ema links vault graph
      - name: Generated files are committed and up to date
        run: git diff --exit-code -- data/processed "vault/04 Compound Notes" "vault/07 Targets" apps/graph-viewer/graph-data.js
      - run: cd scripts && python validate.py --no-report
      - run: python -m pytest -q
      - name: SQLite export (artifact, not versioned)
        run: make export
      - uses: actions/upload-artifact@v4
        with: { name: pharma-vault-db, path: data/processed/pharma-vault.db }
